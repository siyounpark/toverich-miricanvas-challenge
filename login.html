<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>토브리치 챌린지 참가자 로그인</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><link rel="stylesheet" href="./theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.shell{width:min(980px,100%);min-height:650px;display:grid;grid-template-columns:1fr 1.15fr;background:#fff}.brand{padding:48px 38px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}.brand h1{font-size:36px;line-height:1.18;margin:14px 0}.brand p{line-height:1.7;opacity:.9}.step{display:grid;gap:12px}.step div{padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.13)}.panel{padding:36px 42px}.tabs{display:flex;padding:5px;border-radius:14px;margin-bottom:30px}.tabs button{flex:1;border:0;background:transparent;padding:12px;border-radius:10px;font-weight:900;cursor:pointer;touch-action:manipulation}.tabs button.active{background:#fff;box-shadow:0 2px 9px rgba(0,0,0,.07)}h2{font-size:28px;margin:0 0 8px}.muted{color:#777;line-height:1.6;margin-bottom:24px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.input{width:100%;border-radius:13px;padding:14px;font:inherit;font-size:16px}.hint{font-size:12px;color:#999;margin-top:6px}.btn{width:100%;border:0;border-radius:13px;padding:15px;font-weight:900;cursor:pointer;margin-top:6px;touch-action:manipulation;pointer-events:auto;position:relative;z-index:2}.btn:disabled{opacity:.55;cursor:wait}.msg{display:none;margin-top:14px;padding:13px 14px;border-radius:12px;line-height:1.5;background:#f7f2fb;color:#4d2865;font-weight:700}.msg.error{background:#fff0f0;color:#a82d2d}.pending{text-align:center;padding:30px 8px}.pending .icon{font-size:48px}.admin-link{margin-top:18px;text-align:center;font-size:13px}.admin-link a{font-weight:800;text-decoration:none}@media(max-width:760px){body{display:block}.shell{grid-template-columns:1fr;min-height:100vh}.brand{padding:28px 22px}.brand h1{font-size:27px}.step{display:none}.panel{padding:28px 20px}.tabs{margin-bottom:22px}.btn{min-height:52px;font-size:16px}}</style></head><body><main class="shell"><section class="brand"><div><b>TOVERICH CHALLENGE</b><h1>미리캔버스 요소 제작 챌린지</h1><p>현재 모집 중인 회차에 참가 신청하고 관리자 승인 후 참여합니다.</p></div><div class="step"><div>1. 아이디로 가입 또는 로그인</div><div>2. 현재 회차 참가 신청</div><div>3. 관리자 승인 후 참여</div></div></section><section class="panel"><div class="tabs"><button id="loginTab" type="button" class="active">로그인</button><button id="joinTab" type="button">회원가입</button></div><div id="authBox"><h2 id="title">참가자 로그인</h2><div class="muted" id="desc">기존 참가자도 새 회차에 로그인하면 다시 참가 신청할 수 있습니다.</div><form id="authForm" novalidate><div class="field" id="nameField" style="display:none"><label for="name">이름</label><input id="name" class="input" autocomplete="name" placeholder="참가자 이름"></div><div class="field"><label for="username">아이디</label><input id="username" class="input" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="아이디"><div class="hint">영문 소문자, 숫자, _, -, . 조합으로 4~20자</div></div><div class="field"><label for="password">비밀번호</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="비밀번호"><div class="hint">6자 이상 입력해주세요.</div></div><button id="submit" type="submit" class="btn">로그인</button></form><div id="msg" class="msg" role="alert" aria-live="polite"></div><div class="admin-link"><a href="./admin-login.html">관리자 로그인</a></div></div><div id="pendingBox" class="pending" style="display:none"><div class="icon">⏳</div><h2 id="pendingTitle">관리자 승인 대기 중</h2><p class="muted" id="pendingText">현재 회차 참가 신청이 완료되었습니다. 관리자가 승인하면 챌린지에 참여할 수 있습니다.</p><button class="btn" id="logout" type="button">로그아웃</button></div></section></main><script>const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);let mode='login',busy=false;const $=id=>document.getElementById(id);const normalize=v=>String(v||'').trim().toLowerCase();const email=id=>`${id}@challenge.local`;function show(t,error=false){const el=$('msg');el.style.display=t?'block':'none';el.textContent=t;el.className='msg'+(error?' error':'');if(t)el.scrollIntoView({behavior:'smooth',block:'nearest'})}function setBusy(v){busy=v;$('submit').disabled=v;$('submit').textContent=v?'처리 중...':(mode==='join'?'가입 신청':'로그인')}function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('joinTab').classList.toggle('active',m==='join');$('nameField').style.display=m==='join'?'block':'none';$('title').textContent=m==='join'?'참가자 회원가입':'참가자 로그인';$('desc').textContent=m==='join'?'처음 참가하는 분은 이름·아이디·비밀번호를 입력한 뒤 현재 회차에 참가 신청합니다.':'기존 참가자도 새 회차가 열리면 로그인하여 다시 참가 신청합니다.';$('submit').textContent=m==='join'?'가입 신청':'로그인';show('');setTimeout(()=>$(m==='join'?'name':'username').focus(),50)}async function activeChallenge(){const {data,error}=await client.from('challenges').select('id,round_number,enrollment_open').eq('is_active',true).order('round_number',{ascending:false}).limit(1).maybeSingle();if(error)throw error;return data}async function routeUser(user){const {data:p,error}=await client.from('profiles').select('role').eq('id',user.id).single();if(error)throw error;if(p.role==='admin'){location.href='./admin.html';return}const c=await activeChallenge();if(!c){show('현재 모집 중인 챌린지가 없습니다. 다음 회차 오픈을 기다려주세요.',true);return}let {data:cp,error:cpErr}=await client.from('challenge_participants').select('*').eq('challenge_id',c.id).eq('participant_id',user.id).maybeSingle();if(cpErr)throw cpErr;if(!cp){if(!c.enrollment_open){show('현재 회차 참가 모집이 마감되었습니다.',true);return}const ins=await client.from('challenge_participants').insert({challenge_id:c.id,participant_id:user.id,approval_status:'pending'}).select().single();if(ins.error)throw ins.error;cp=ins.data}if(cp.approval_status==='approved'){location.href='./index.html';return}$('authBox').style.display='none';$('pendingBox').style.display='block';$('pendingTitle').textContent=`${c.round_number}기 관리자 승인 대기 중`;$('pendingText').textContent=`${c.round_number}기 참가 신청이 완료되었습니다. 관리자가 승인하면 챌린지에 참여할 수 있습니다.`}async function register(username,password,name){const r=await fetch(`${APP_CONFIG.SUPABASE_URL}/functions/v1/register-username`,{method:'POST',headers:{'Content-Type':'application/json','apikey':APP_CONFIG.SUPABASE_KEY},body:JSON.stringify({username,password,display_name:name})});let j={};try{j=await r.json()}catch{}return{ok:r.ok,data:j}}$('loginTab').addEventListener('click',()=>setMode('login'));$('joinTab').addEventListener('click',()=>setMode('join'));$('authForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const username=normalize($('username').value),password=$('password').value,name=$('name').value.trim();if(mode==='join'&&!name)return show('이름을 입력해주세요.',true);if(!username||!password)return show('아이디와 비밀번호를 입력해주세요.',true);if(!/^[a-z0-9_.-]{4,20}$/.test(username))return show('아이디는 영문 소문자·숫자·_·-·. 조합으로 4~20자로 입력해주세요.',true);if(password.length<6)return show('비밀번호는 6자 이상 입력해주세요.',true);setBusy(true);show('처리 중입니다...');try{if(mode==='join'){const r=await register(username,password,name);if(!r.ok){show(r.data.error||'가입 처리 중 오류가 발생했습니다.',true);return}const {data,error}=await client.auth.signInWithPassword({email:email(username),password});if(error){show('가입은 완료되었습니다. 로그인 탭에서 다시 로그인해주세요.',true);return}await routeUser(data.user)}else{const {data,error}=await client.auth.signInWithPassword({email:email(username),password});if(error){show('로그인에 실패했습니다. 아이디와 비밀번호를 확인해주세요.',true);return}await routeUser(data.user)}}catch(err){console.error(err);show('참가 신청 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.',true)}finally{setBusy(false)}});$('logout').addEventListener('click',async()=>{await client.auth.signOut();location.reload()});</script></body></html>
