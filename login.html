<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토브리치 챌린지 로그인</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;background:linear-gradient(135deg,#f5f3ff,#fff7ef);color:#1e1e24;min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(980px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid #ebe8f5;border-radius:30px;overflow:hidden;box-shadow:0 24px 70px rgba(68,55,150,.12)}.brand{padding:52px;background:linear-gradient(145deg,#5848df,#8874ff);color:#fff;display:flex;flex-direction:column;justify-content:space-between}.brand h1{font-size:38px;line-height:1.2;margin:0 0 16px}.brand p{line-height:1.7;opacity:.9}.brand .step{display:grid;gap:12px;margin-top:36px}.step div{background:rgba(255,255,255,.12);padding:14px 16px;border-radius:16px}.panel{padding:44px}.tabs{display:flex;background:#f4f3f8;padding:5px;border-radius:14px;margin-bottom:28px}.tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:10px;font-weight:800;cursor:pointer}.tabs button.active{background:#fff;color:#5d4ce3;box-shadow:0 2px 10px rgba(0,0,0,.06)}h2{margin:0 0 8px;font-size:28px}.muted{color:#777;line-height:1.6;margin-bottom:24px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.input{width:100%;border:1px solid #dddbea;border-radius:13px;padding:13px 14px;font:inherit}.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:900;cursor:pointer;background:#6555e8;color:#fff;margin-top:5px}.btn.secondary{background:#f0eefc;color:#5949d5}.msg{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f8f7fc;color:#555;display:none}.pending{text-align:center;padding:26px 6px}.pending .icon{font-size:48px}.admin-note{font-size:13px;color:#777;margin-top:16px;text-align:center}@media(max-width:760px){.shell{grid-template-columns:1fr}.brand{padding:32px}.brand .step{display:none}.panel{padding:30px 24px}}</style></head><body><main class="shell"><section class="brand"><div><div style="font-weight:900;letter-spacing:.04em;margin-bottom:16px">TOVERICH CHALLENGE</div><h1>미리캔버스 요소 제작 챌린지</h1><p>회원가입 후 관리자 승인을 받으면 챌린지 화면에 입장할 수 있습니다.</p></div><div class="step"><div>1. 회원가입 / 로그인</div><div>2. 관리자 승인</div><div>3. DAY별 챌린지 참여</div></div></section><section class="panel"><div class="tabs"><button id="loginTab" class="active">로그인</button><button id="joinTab">회원가입</button><button id="adminTab">관리자</button></div><div id="authBox"><h2 id="title">참가자 로그인</h2><div class="muted" id="desc">승인된 참가자는 로그인 후 바로 챌린지에 입장합니다.</div><div class="field" id="nameField" style="display:none"><label>이름</label><input id="name" class="input" placeholder="참가자 이름"></div><div class="field"><label>이메일</label><input id="email" class="input" type="email" placeholder="name@example.com"></div><div class="field"><label>비밀번호</label><input id="password" class="input" type="password" placeholder="6자 이상"></div><button id="submit" class="btn">로그인</button><div id="msg" class="msg"></div><div class="admin-note" id="adminNote" style="display:none">관리자 계정만 관리자 모드로 이동합니다.</div></div><div id="pendingBox" class="pending" style="display:none"><div class="icon">⏳</div><h2>관리자 승인 대기 중</h2><p class="muted">가입 신청이 완료되었습니다. 관리자가 승인하면 챌린지에 참여할 수 있습니다.</p><button class="btn secondary" id="logout">로그아웃</button></div></section></main><script>const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);let mode='login';const $=id=>document.getElementById(id);function setMode(m){mode=m;['loginTab','joinTab','adminTab'].forEach(id=>$(id).classList.remove('active'));$(m==='login'?'loginTab':m==='join'?'joinTab':'adminTab').classList.add('active');$('nameField').style.display=m==='join'?'block':'none';$('adminNote').style.display=m==='admin'?'block':'none';$('title').textContent=m==='join'?'참가자 회원가입':m==='admin'?'관리자 로그인':'참가자 로그인';$('desc').textContent=m==='join'?'가입 후 관리자 승인을 기다려주세요.':m==='admin'?'관리자 권한이 있는 계정으로 로그인하세요.':'승인된 참가자는 로그인 후 바로 챌린지에 입장합니다.';$('submit').textContent=m==='join'?'가입 신청':m==='admin'?'관리자 로그인':'로그인';show('')};function show(t){$('msg').style.display=t?'block':'none';$('msg').textContent=t}async function routeUser(user,adminOnly=false){const {data:p,error}=await client.from('profiles').select('role,approval_status,display_name').eq('id',user.id).single();if(error){show('사용자 정보를 불러오지 못했습니다.');return}if(adminOnly){if(p.role==='admin'){location.href='./admin.html'}else show('관리자 권한이 없는 계정입니다.');return}if(p.role==='admin'){location.href='./admin.html';return}if(p.approval_status==='approved'){location.href='./index.html'}else{$('authBox').style.display='none';$('pendingBox').style.display='block'}}$('loginTab').onclick=()=>setMode('login');$('joinTab').onclick=()=>setMode('join');$('adminTab').onclick=()=>setMode('admin');$('submit').onclick=async()=>{show('처리 중입니다...');const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return show('이메일과 비밀번호를 입력해주세요.');if(mode==='join'){const name=$('name').value.trim();if(!name)return show('이름을 입력해주세요.');const {data,error}=await client.auth.signUp({email,password,options:{data:{display_name:name}}});if(error)return show(error.message);if(data.user){show('가입 신청이 완료되었습니다. 이메일 확인이 필요한 경우 메일을 확인해주세요.');setTimeout(()=>routeUser(data.user),600)}}else{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)return show('로그인에 실패했습니다. 이메일과 비밀번호를 확인해주세요.');await routeUser(data.user,mode==='admin')}};$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};(async()=>{const {data:{session}}=await client.auth.getSession();if(session)await routeUser(session.user,false)})();</script></body></html>
