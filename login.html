<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토브리치 챌린지 참가자 로그인</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><link rel="stylesheet" href="./theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.shell{width:min(980px,100%);min-height:650px;display:grid;grid-template-columns:1fr 1.15fr;background:#fff}.brand{padding:48px 38px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}.brand h1{font-size:36px;line-height:1.18;margin:14px 0}.brand p{line-height:1.7;opacity:.9}.step{display:grid;gap:12px}.step div{padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.13)}.panel{padding:36px 42px}.tabs{display:flex;padding:5px;border-radius:14px;margin-bottom:30px}.tabs button{flex:1;border:0;background:transparent;padding:12px;border-radius:10px;font-weight:900;cursor:pointer}.tabs button.active{background:#fff;box-shadow:0 2px 9px rgba(0,0,0,.07)}h2{font-size:28px;margin:0 0 8px}.muted{color:#777;line-height:1.6;margin-bottom:24px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.input{width:100%;border-radius:13px;padding:14px;font:inherit}.hint{font-size:12px;color:#999;margin-top:6px}.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:900;cursor:pointer;margin-top:6px}.btn:disabled{opacity:.55}.msg{display:none;margin-top:14px;padding:13px 14px;border-radius:12px;line-height:1.5}.pending{text-align:center;padding:30px 8px}.pending .icon{font-size:48px}.admin-link{margin-top:18px;text-align:center;font-size:13px}.admin-link a{font-weight:800;text-decoration:none}@media(max-width:760px){.shell{grid-template-columns:1fr}.brand{padding:30px}.step{display:none}.panel{padding:30px 24px}}</style></head><body><main class="shell"><section class="brand"><div><b>TOVERICH CHALLENGE</b><h1>미리캔버스 요소 제작 챌린지</h1><p>현재 모집 중인 회차에 참가 신청하고 관리자 승인 후 참여합니다.</p></div><div class="step"><div>1. 아이디로 가입 또는 로그인</div><div>2. 현재 회차 참가 신청</div><div>3. 관리자 승인 후 참여</div></div></section><section class="panel"><div class="tabs"><button id="loginTab" class="active">로그인</button><button id="joinTab">회원가입</button></div><div id="authBox"><h2 id="title">참가자 로그인</h2><div class="muted" id="desc">기존 참가자도 새 회차에 로그인하면 다시 참가 신청할 수 있습니다.</div><div class="field" id="nameField" style="display:none"><label>이름</label><input id="name" class="input" placeholder="참가자 이름"></div><div class="field"><label>아이디</label><input id="username" class="input" autocomplete="username" placeholder="아이디"><div class="hint">영문 소문자, 숫자, _, -, . 조합으로 4~20자</div></div><div class="field"><label>비밀번호</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="비밀번호"></div><button id="submit" class="btn">로그인</button><div id="msg" class="msg"></div><div class="admin-link"><a href="./admin-login.html">관리자 로그인</a></div></div><div id="pendingBox" class="pending" style="display:none"><div class="icon">⏳</div><h2 id="pendingTitle">관리자 승인 대기 중</h2><p class="muted" id="pendingText">현재 회차 참가 신청이 완료되었습니다. 관리자가 승인하면 챌린지에 참여할 수 있습니다.</p><button class="btn" id="logout">로그아웃</button></div></section></main><script>const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);let mode='login',busy=false;const $=id=>document.getElementById(id);const normalize=v=>String(v||'').trim().toLowerCase();const email=id=>`${id}@challenge.local`;function show(t){const el=$('msg');el.style.display=t?'block':'none';el.textContent=t}function setBusy(v){busy=v;$('submit').disabled=v}function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('joinTab').classList.toggle('active',m==='join');$('nameField').style.display=m==='join'?'block':'none';$('title').textContent=m==='join'?'참가자 회원가입':'참가자 로그인';$('desc').textContent=m==='join'?'처음 참가하는 분은 아이디를 만든 뒤 현재 회차에 참가 신청합니다.':'기존 참가자도 새 회차가 열리면 로그인하여 다시 참가 신청합니다.';$('submit').textContent=m==='join'?'가입 신청':'로그인';show('')}async function activeChallenge(){const {data}=await client.from('challenges').select('id,round_number,enrollment_open').eq('is_active',true).order('round_number',{ascending:false}).limit(1).maybeSingle();return data}async function routeUser(user){const {data:p,error}=await client.from('profiles').select('role').eq('id',user.id).single();if(error){show('사용자 정보를 불러오지 못했습니다.');return}if(p.role==='admin'){location.href='./admin.html';return}const c=await activeChallenge();if(!c){show('현재 모집 중인 챌린지가 없습니다. 다음 회차 오픈을 기다려주세요.');return}let {data:cp}=await client.from('challenge_participants').select('*').eq('challenge_id',c.id).eq('participant_id',user.id).maybeSingle();if(!cp){if(!c.enrollment_open){show('현재 회차 참가 모집이 마감되었습니다.');return}const ins=await client.from('challenge_participants').insert({challenge_id:c.id,participant_id:user.id,approval_status:'pending'}).select().single();if(ins.error){show('참가 신청을 처리하지 못했습니다.');return}cp=ins.data}if(cp.approval_status==='approved'){location.href='./index.html';return}$('authBox').style.display='none';$('pendingBox').style.display='block';$('pendingTitle').textContent=`${c.round_number}기 관리자 승인 대기 중`;$('pendingText').textContent=`${c.round_number}기 참가 신청이 완료되었습니다. 관리자가 승인하면 챌린지에 참여할 수 있습니다.`}async function register(username,password,name){const r=await fetch(`${APP_CONFIG.SUPABASE_URL}/functions/v1/register-username`,{method:'POST',headers:{'Content-Type':'application/json','apikey':APP_CONFIG.SUPABASE_KEY},body:JSON.stringify({username,password,display_name:name})});const j=await r.json();return{ok:r.ok,data:j}}$('loginTab').onclick=()=>setMode('login');$('joinTab').onclick=()=>setMode('join');$('submit').onclick=async()=>{if(busy)return;const username=normalize($('username').value),password=$('password').value;if(!username||!password)return show('아이디와 비밀번호를 입력해주세요.');if(!/^[a-z0-9_.-]{4,20}$/.test(username))return show('아이디 형식을 확인해주세요.');if(password.length<6)return show('비밀번호는 6자 이상 입력해주세요.');setBusy(true);show('처리 중입니다...');try{if(mode==='join'){const name=$('name').value.trim();if(!name){show('이름을 입력해주세요.');return}const r=await register(username,password,name);if(!r.ok){show(r.data.error||'가입 처리 중 오류가 발생했습니다.');return}const {data,error}=await client.auth.signInWithPassword({email:email(username),password});if(error){show('가입은 완료되었습니다. 로그인 탭에서 다시 로그인해주세요.');return}await routeUser(data.user)}else{const {data,error}=await client.auth.signInWithPassword({email:email(username),password});if(error){show('로그인에 실패했습니다. 아이디와 비밀번호를 확인해주세요.');return}await routeUser(data.user)}}catch(e){show('요청을 처리하지 못했습니다. 잠시 후 다시 시도해주세요.')}finally{setBusy(false)}};$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};</script></body></html>
