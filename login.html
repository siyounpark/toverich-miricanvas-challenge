<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토브리치 챌린지 로그인</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;background:linear-gradient(135deg,#f5f3ff,#fff7ef);color:#1e1e24;min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(980px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid #ebe8f5;border-radius:30px;overflow:hidden;box-shadow:0 24px 70px rgba(68,55,150,.12)}.brand{padding:52px;background:linear-gradient(145deg,#5848df,#8874ff);color:#fff;display:flex;flex-direction:column;justify-content:space-between}.brand h1{font-size:38px;line-height:1.2;margin:0 0 16px}.brand p{line-height:1.7;opacity:.9}.brand .step{display:grid;gap:12px;margin-top:36px}.step div{background:rgba(255,255,255,.12);padding:14px 16px;border-radius:16px}.panel{padding:44px}.tabs{display:flex;background:#f4f3f8;padding:5px;border-radius:14px;margin-bottom:28px}.tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:10px;font-weight:800;cursor:pointer}.tabs button.active{background:#fff;color:#5d4ce3;box-shadow:0 2px 10px rgba(0,0,0,.06)}h2{margin:0 0 8px;font-size:28px}.muted{color:#777;line-height:1.6;margin-bottom:24px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.input{width:100%;border:1px solid #dddbea;border-radius:13px;padding:13px 14px;font:inherit}.hint{font-size:12px;color:#888;margin-top:6px;line-height:1.5}.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:900;cursor:pointer;background:#6555e8;color:#fff;margin-top:5px}.btn.secondary{background:#f0eefc;color:#5949d5}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f8f7fc;color:#555;display:none;line-height:1.55}.msg.ok{background:#eefaf3;color:#21633c}.msg.warn{background:#fff7e8;color:#7a5715}.pending{text-align:center;padding:26px 6px}.pending .icon{font-size:48px}.admin-note{font-size:13px;color:#777;margin-top:16px;text-align:center}@media(max-width:760px){.shell{grid-template-columns:1fr}.brand{padding:32px}.brand .step{display:none}.panel{padding:30px 24px}}</style></head><body><main class="shell"><section class="brand"><div><div style="font-weight:900;letter-spacing:.04em;margin-bottom:16px">TOVERICH CHALLENGE</div><h1>미리캔버스 요소 제작 챌린지</h1><p>아이디와 비밀번호로 가입한 뒤 관리자 승인을 받으면 챌린지에 참여할 수 있습니다.</p></div><div class="step"><div>1. 아이디로 회원가입</div><div>2. 관리자 승인</div><div>3. DAY별 챌린지 참여</div></div></section><section class="panel"><div class="tabs"><button id="loginTab" class="active">로그인</button><button id="joinTab">회원가입</button><button id="adminTab">관리자</button></div><div id="authBox"><h2 id="title">참가자 로그인</h2><div class="muted" id="desc">승인된 참가자는 아이디와 비밀번호로 로그인합니다.</div><div class="field" id="nameField" style="display:none"><label>이름</label><input id="name" class="input" placeholder="참가자 이름"></div><div class="field"><label>아이디</label><input id="username" class="input" autocomplete="username" placeholder="예: toverich01"><div class="hint">영문 소문자, 숫자, _, -, . 조합으로 4~20자</div></div><div class="field"><label>비밀번호</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="6자 이상"></div><button id="submit" class="btn">로그인</button><div id="msg" class="msg"></div><div class="admin-note" id="adminNote" style="display:none">관리자 권한이 있는 아이디만 관리자 모드로 이동합니다.</div></div><div id="pendingBox" class="pending" style="display:none"><div class="icon">⏳</div><h2>관리자 승인 대기 중</h2><p class="muted">가입은 완료되었습니다. 관리자가 승인하면 바로 챌린지에 참여할 수 있습니다.</p><button class="btn secondary" id="logout">로그아웃</button></div></section></main><script>const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);let mode='login';let busy=false;const $=id=>document.getElementById(id);function setMode(m){mode=m;['loginTab','joinTab','adminTab'].forEach(id=>$(id).classList.remove('active'));$(m==='login'?'loginTab':m==='join'?'joinTab':'adminTab').classList.add('active');$('nameField').style.display=m==='join'?'block':'none';$('adminNote').style.display=m==='admin'?'block':'none';$('title').textContent=m==='join'?'참가자 회원가입':m==='admin'?'관리자 로그인':'참가자 로그인';$('desc').textContent=m==='join'?'이메일 없이 아이디와 비밀번호로 가입합니다. 가입 후 관리자 승인을 기다려주세요.':m==='admin'?'관리자 권한이 있는 아이디로 로그인하세요.':'승인된 참가자는 아이디와 비밀번호로 로그인합니다.';$('submit').textContent=m==='join'?'가입 신청':m==='admin'?'관리자 로그인':'로그인';$('password').setAttribute('autocomplete',m==='join'?'new-password':'current-password');show('')};function show(t,type=''){const el=$('msg');el.style.display=t?'block':'none';el.textContent=t;el.className='msg'+(type?' '+type:'')};function setBusy(v){busy=v;$('submit').disabled=v}function normalizeId(v){return String(v||'').trim().toLowerCase()}function internalEmail(id){return `${id}@challenge.local`}async function routeUser(user,adminOnly=false){const {data:p,error}=await client.from('profiles').select('role,approval_status,display_name,username').eq('id',user.id).single();if(error){show('사용자 정보를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');return}if(adminOnly){if(p.role==='admin'){location.href='./admin.html'}else show('관리자 권한이 없는 계정입니다.');return}if(p.role==='admin'){location.href='./admin.html';return}if(p.approval_status==='approved'){location.href='./index.html'}else{$('authBox').style.display='none';$('pendingBox').style.display='block'}}$('loginTab').onclick=()=>setMode('login');$('joinTab').onclick=()=>setMode('join');$('adminTab').onclick=()=>setMode('admin');$('submit').onclick=async()=>{if(busy)return;const username=normalizeId($('username').value),password=$('password').value;if(!username||!password)return show('아이디와 비밀번호를 입력해주세요.');if(!/^[a-z0-9_.-]{4,20}$/.test(username))return show('아이디 형식을 확인해주세요. 영문 소문자, 숫자, _, -, . 조합으로 4~20자입니다.');if(password.length<6)return show('비밀번호는 6자 이상 입력해주세요.');setBusy(true);show('처리 중입니다...');try{if(mode==='join'){const name=$('name').value.trim();if(!name){show('이름을 입력해주세요.');return}const res=await fetch(`${APP_CONFIG.SUPABASE_URL}/functions/v1/register-username`,{method:'POST',headers:{'Content-Type':'application/json','apikey':APP_CONFIG.SUPABASE_KEY},body:JSON.stringify({username,password,display_name:name})});const result=await res.json();if(!res.ok){show(result.error||'가입 처리 중 오류가 발생했습니다.');return}const {data,error}=await client.auth.signInWithPassword({email:internalEmail(username),password});if(error){show('가입은 완료되었지만 자동 로그인에 실패했습니다. 로그인 탭에서 다시 로그인해주세요.','warn');return}show('가입이 완료되었습니다. 관리자 승인을 기다려주세요.','ok');await routeUser(data.user)}else{const {data,error}=await client.auth.signInWithPassword({email:internalEmail(username),password});if(error){show('로그인에 실패했습니다. 아이디와 비밀번호를 확인해주세요.');return}await routeUser(data.user,mode==='admin')}}catch(e){show('요청을 처리하지 못했습니다. 잠시 후 다시 시도해주세요.')}finally{setBusy(false)}};$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};(async()=>{const {data:{session}}=await client.auth.getSession();if(session)await routeUser(session.user,false)})();</script></body></html>
