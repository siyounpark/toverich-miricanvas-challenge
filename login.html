<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토브리치 챌린지 참가자 로그인</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;background:#f7f6fb;color:#1d1d23;min-height:100vh;display:grid;place-items:center}.shell{width:min(980px,100%);min-height:650px;display:grid;grid-template-columns:1fr 1.15fr;background:#fff}.brand{padding:48px 38px;background:linear-gradient(145deg,#5b49df,#7560ef);color:#fff;display:flex;flex-direction:column;justify-content:space-between}.brand h1{font-size:36px;line-height:1.18;margin:14px 0}.brand p{line-height:1.7;opacity:.9}.step{display:grid;gap:12px}.step div{padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.13)}.panel{padding:36px 42px}.tabs{display:flex;background:#f4f3f8;padding:5px;border-radius:14px;margin-bottom:30px}.tabs button{flex:1;border:0;background:transparent;padding:12px;border-radius:10px;font-weight:900;cursor:pointer}.tabs button.active{background:#fff;color:#5e4ce2;box-shadow:0 2px 9px rgba(0,0,0,.07)}h2{font-size:28px;margin:0 0 8px}.muted{color:#777;line-height:1.6;margin-bottom:24px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.input{width:100%;border:1px solid #dddbea;border-radius:13px;padding:14px;font:inherit}.hint{font-size:12px;color:#999;margin-top:6px}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#6554e8;color:#fff;font-weight:900;cursor:pointer;margin-top:6px}.btn:disabled{opacity:.55}.msg{display:none;margin-top:14px;padding:13px 14px;border-radius:12px;background:#f7f6fb;color:#555;line-height:1.5}.msg.ok{background:#edf9f1;color:#21613b}.pending{text-align:center;padding:30px 8px}.pending .icon{font-size:48px}.admin-link{margin-top:18px;text-align:center;font-size:13px}.admin-link a{color:#6554e8;font-weight:800;text-decoration:none}@media(max-width:760px){.shell{grid-template-columns:1fr}.brand{padding:30px}.step{display:none}.panel{padding:30px 24px}}</style></head><body><main class="shell"><section class="brand"><div><b>TOVERICH CHALLENGE</b><h1>미리캔버스 요소 제작 챌린지</h1><p>참가자는 아이디로 가입하고 관리자 승인 후 챌린지에 참여합니다.</p></div><div class="step"><div>1. 아이디로 회원가입</div><div>2. 관리자 승인</div><div>3. DAY별 챌린지 참여</div></div></section><section class="panel"><div class="tabs"><button id="loginTab" class="active">로그인</button><button id="joinTab">회원가입</button></div><div id="authBox"><h2 id="title">참가자 로그인</h2><div class="muted" id="desc">승인된 참가자는 아이디와 비밀번호로 로그인합니다.</div><div class="field" id="nameField" style="display:none"><label>이름</label><input id="name" class="input" placeholder="참가자 이름"></div><div class="field"><label>아이디</label><input id="username" class="input" autocomplete="username" placeholder="아이디"><div class="hint">영문 소문자, 숫자, _, -, . 조합으로 4~20자</div></div><div class="field"><label>비밀번호</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="비밀번호"></div><button id="submit" class="btn">로그인</button><div id="msg" class="msg"></div><div class="admin-link"><a href="./admin-login.html">관리자 로그인</a></div></div><div id="pendingBox" class="pending" style="display:none"><div class="icon">⏳</div><h2>관리자 승인 대기 중</h2><p class="muted">가입이 완료되었습니다. 관리자가 승인하면 챌린지에 참여할 수 있습니다.</p><button class="btn" id="logout">로그아웃</button></div></section></main><script>const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);let mode='login',busy=false;const $=id=>document.getElementById(id);const normalize=v=>String(v||'').trim().toLowerCase();const email=id=>`${id}@challenge.local`;function show(t,type=''){const el=$('msg');el.style.display=t?'block':'none';el.textContent=t;el.className='msg'+(type?' '+type:'')}function setBusy(v){busy=v;$('submit').disabled=v}function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('joinTab').classList.toggle('active',m==='join');$('nameField').style.display=m==='join'?'block':'none';$('title').textContent=m==='join'?'참가자 회원가입':'참가자 로그인';$('desc').textContent=m==='join'?'이메일 없이 아이디와 비밀번호로 가입합니다. 가입 후 관리자 승인을 기다려주세요.':'승인된 참가자는 아이디와 비밀번호로 로그인합니다.';$('submit').textContent=m==='join'?'가입 신청':'로그인';show('')}async function routeUser(user){const {data:p,error}=await client.from('profiles').select('role,approval_status').eq('id',user.id).single();if(error){show('사용자 정보를 불러오지 못했습니다.');return}if(p.role==='admin'){location.href='./admin.html';return}if(p.approval_status==='approved')location.href='./index.html';else{$('authBox').style.display='none';$('pendingBox').style.display='block'}}async function register(username,password,name){const r=await fetch(`${APP_CONFIG.SUPABASE_URL}/functions/v1/register-username`,{method:'POST',headers:{'Content-Type':'application/json','apikey':APP_CONFIG.SUPABASE_KEY},body:JSON.stringify({username,password,display_name:name})});const j=await r.json();return{ok:r.ok,data:j}}$('loginTab').onclick=()=>setMode('login');$('joinTab').onclick=()=>setMode('join');$('submit').onclick=async()=>{if(busy)return;const username=normalize($('username').value),password=$('password').value;if(!username||!password)return show('아이디와 비밀번호를 입력해주세요.');if(!/^[a-z0-9_.-]{4,20}$/.test(username))return show('아이디 형식을 확인해주세요.');if(password.length<6)return show('비밀번호는 6자 이상 입력해주세요.');setBusy(true);show('처리 중입니다...');try{if(mode==='join'){const name=$('name').value.trim();if(!name){show('이름을 입력해주세요.');return}const r=await register(username,password,name);if(!r.ok){show(r.data.error||'가입 처리 중 오류가 발생했습니다.');return}const {data,error}=await client.auth.signInWithPassword({email:email(username),password});if(error){show('가입은 완료되었습니다. 로그인 탭에서 다시 로그인해주세요.');return}await routeUser(data.user)}else{const {data,error}=await client.auth.signInWithPassword({email:email(username),password});if(error){show('로그인에 실패했습니다. 아이디와 비밀번호를 확인해주세요.');return}await routeUser(data.user)}}catch(e){show('요청을 처리하지 못했습니다. 잠시 후 다시 시도해주세요.')}finally{setBusy(false)}};$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};</script></body></html>
