<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토브리치 챌린지 관리자</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><link rel="stylesheet" href="./theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;background:#f5f6fb;color:#202124}.wrap{max-width:1240px;margin:auto;padding:26px 20px 60px}.hero{color:#fff;border-radius:24px;padding:26px 30px;display:flex;justify-content:space-between;gap:16px;align-items:center}.hero h1{margin:0 0 7px}.hero p{margin:0;opacity:.9}.badge{padding:10px 14px;border-radius:999px;font-weight:800}.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:20px}.card{background:#fff;border:1px solid #e7e8ef;border-radius:20px;padding:22px}h2{margin:0 0 18px;font-size:20px}.field{margin-bottom:14px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.input,.textarea{width:100%;border:1px solid #dcddea;border-radius:12px;padding:12px 13px;font:inherit}.textarea{min-height:88px;resize:vertical}.duration{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.duration button,.daybtn{border:1px solid #d9d9e8;background:#fff;padding:11px 6px;border-radius:12px;font-weight:800;cursor:pointer}.duration button.active,.daybtn.active{color:#fff}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.warn{background:#fff1df!important;color:#a76400!important}.btn.danger{background:#fff0f0!important;color:#b83b3b!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.daylist{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}.small{font-size:13px;color:#777;line-height:1.5}.status{padding:12px 14px;border-radius:12px;margin-top:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.box{background:#f8f8fc;border-radius:14px;padding:13px}.num{font-size:25px;font-weight:900}.section{margin-top:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-weight:800;font-size:12px;background:#fff3d9;color:#8b6511}.progress-pill{display:inline-block;min-width:58px;text-align:center;padding:6px 10px;border-radius:999px;font-weight:900;font-size:13px}.subgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.top-actions{display:flex;gap:8px;align-items:center}.notice{padding:13px 15px;border-radius:14px;margin-top:14px}@media(max-width:850px){.grid{grid-template-columns:1fr}.daylist{grid-template-columns:repeat(3,1fr)}.subgrid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.table{display:block;overflow:auto}}</style></head><body><main class="wrap"><section class="hero"><div><h1>토브리치 챌린지 관리자</h1><p>챌린지 기간, DAY 주제, 참가자 승인과 진행상황을 관리합니다.</p></div><div class="top-actions"><span class="badge" id="adminName">ADMIN</span><button class="btn secondary" id="logout">로그아웃</button></div></section><div class="notice">키워드는 <strong>대표요소주제 1개 + 부주제 5개</strong>만 참가자 화면에 표시됩니다.</div><div class="grid"><section class="card"><h2>챌린지 기본 설정</h2><div class="field"><label>챌린지명</label><input id="challengeName" class="input"></div><div class="field"><label>시작일</label><input id="startDate" class="input" type="date"></div><div class="field"><label>기간</label><div class="duration" id="durationBtns"><button data-days="10">10일</button><button data-days="20">20일</button><button data-days="30">30일</button></div></div><div class="field"><label>참가자 안내문</label><textarea id="intro" class="textarea"></textarea></div><div class="actions"><button class="btn" id="saveBasic">기본 설정 저장</button></div><div class="summary"><div class="box"><div class="small">운영 기간</div><div class="num"><span id="durationStat">10</span>일</div></div><div class="box"><div class="small">준비 DAY</div><div class="num" id="readyStat">0</div></div><div class="box"><div class="small">승인 대기</div><div class="num" id="pendingStat">0</div></div></div></section><section class="card"><h2>DAY별 콘텐츠 관리</h2><div id="dayList" class="daylist"></div><div class="field"><label>대표요소주제</label><input id="dayTitle" class="input" placeholder="예: 무화과"></div><div class="field"><label>부주제 5개</label><div class="subgrid"><input class="input sub" placeholder="부주제 1"><input class="input sub" placeholder="부주제 2"><input class="input sub" placeholder="부주제 3"><input class="input sub" placeholder="부주제 4"><input class="input sub" placeholder="부주제 5"></div></div><div class="actions"><button class="btn" id="saveDay">이 DAY 저장</button><button class="btn danger" id="deleteDay">DAY 삭제</button></div><div id="saveStatus" class="status">DAY 1을 편집합니다.</div></section></div><section class="card section"><h2>참가자 승인 관리</h2><table class="table"><thead><tr><th>참가자</th><th>이메일</th><th>가입일</th><th>인증횟수</th><th>상태</th><th>관리</th></tr></thead><tbody id="members"></tbody></table></section></main><script>const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);const $=id=>document.getElementById(id);let me,challenge,days=[],selected=1,duration=10;async function guard(){const {data:{session}}=await client.auth.getSession();if(!session){location.href='./admin-login.html';return false}const {data:p}=await client.from('profiles').select('*').eq('id',session.user.id).single();if(!p||p.role!=='admin'){alert('관리자 권한이 필요합니다.');location.href='./admin-login.html';return false}me=p;$('adminName').textContent=p.display_name||'ADMIN';return true}async function load(){if(!await guard())return;const {data:c}=await client.from('challenges').select('*').eq('is_active',true).order('created_at',{ascending:false}).limit(1).maybeSingle();challenge=c||null;if(c){duration=c.duration_days;$('challengeName').value=c.title;$('startDate').value=c.start_date||'';$('intro').value=c.participant_notice||'';const {data:d}=await client.from('challenge_days').select('*').eq('challenge_id',c.id).order('day_number');days=d||[]}else{$('challengeName').value='토브리치 미리캔버스 요소 제작 챌린지';$('intro').value='매일 오늘의 주제로 요소를 만들고 인증해주세요.'}renderDuration();renderDays();loadDay();await loadMembers();updateStats()}function renderDuration(){document.querySelectorAll('#durationBtns button').forEach(b=>b.classList.toggle('active',Number(b.dataset.days)===duration));$('durationStat').textContent=duration}function renderDays(){$('dayList').innerHTML='';for(let i=1;i<=duration;i++){const b=document.createElement('button');b.className='daybtn'+(i===selected?' active':'');b.textContent='DAY '+i;b.onclick=()=>{selected=i;renderDays();loadDay()};$('dayList').appendChild(b)}}function loadDay(){const d=days.find(x=>x.day_number===selected);$('dayTitle').value=d?.topic||'';document.querySelectorAll('.sub').forEach((el,i)=>el.value=(d?.keywords||[])[i]||'');$('saveStatus').textContent=`DAY ${selected}을 편집하고 있습니다.`}function updateStats(){$('readyStat').textContent=days.filter(d=>d.topic&&(d.keywords||[]).length===5).length}document.querySelectorAll('#durationBtns button').forEach(b=>b.onclick=()=>{duration=Number(b.dataset.days);if(selected>duration)selected=duration;renderDuration();renderDays();loadDay()});$('saveBasic').onclick=async()=>{const payload={title:$('challengeName').value.trim(),start_date:$('startDate').value||null,duration_days:duration,participant_notice:$('intro').value.trim(),is_active:true,created_by:me.id,updated_at:new Date().toISOString()};let r;if(challenge)r=await client.from('challenges').update(payload).eq('id',challenge.id).select().single();else r=await client.from('challenges').insert(payload).select().single();if(r.error)return alert(r.error.message);challenge=r.data;alert('기본 설정을 저장했습니다.');await load()};$('saveDay').onclick=async()=>{if(!challenge)return alert('먼저 챌린지 기본 설정을 저장해주세요.');const subs=[...document.querySelectorAll('.sub')].map(x=>x.value.trim()).filter(Boolean);if(!$('dayTitle').value.trim())return alert('대표요소주제를 입력해주세요.');if(subs.length!==5)return alert('부주제는 정확히 5개 입력해주세요.');const old=days.find(x=>x.day_number===selected);const payload={challenge_id:challenge.id,day_number:selected,topic:$('dayTitle').value.trim(),keywords:subs,description:old?.description||'',styles:old?.styles||[],reference_note:old?.reference_note||'',updated_at:new Date().toISOString()};let r=old?await client.from('challenge_days').update(payload).eq('id',old.id).select().single():await client.from('challenge_days').insert(payload).select().single();if(r.error)return alert(r.error.message);$('saveStatus').textContent=`DAY ${selected} 저장 완료 ✓`;await load()};$('deleteDay').onclick=async()=>{const d=days.find(x=>x.day_number===selected);if(!d)return;if(!confirm(`DAY ${selected} 내용을 삭제할까요?`))return;const {error}=await client.from('challenge_days').delete().eq('id',d.id);if(error)return alert(error.message);await load()};async function loadMembers(){const {data}=await client.from('profiles').select('*').neq('role','admin').order('created_at',{ascending:false});const list=data||[];$('pendingStat').textContent=list.filter(x=>x.approval_status==='pending').length;let counts={};if(challenge){const {data:subs,error:subsErr}=await client.from('submissions').select('participant_id,challenge_day_id').eq('challenge_id',challenge.id);if(!subsErr){const uniqueByParticipant={};(subs||[]).forEach(s=>{if(!uniqueByParticipant[s.participant_id])uniqueByParticipant[s.participant_id]=new Set();uniqueByParticipant[s.participant_id].add(s.challenge_day_id)});Object.entries(uniqueByParticipant).forEach(([id,set])=>counts[id]=set.size)}}$('members').innerHTML=list.length?list.map(p=>`<tr><td>${p.display_name||'-'}</td><td>${p.email||'-'}</td><td>${new Date(p.created_at).toLocaleDateString('ko-KR')}</td><td><span class="progress-pill">${counts[p.id]||0}/${duration}</span></td><td><span class="pill ${p.approval_status==='approved'?'approved':''}">${p.approval_status}</span></td><td><button class="btn ${p.approval_status==='approved'?'warn':''}" onclick="setApproval('${p.id}','${p.approval_status==='approved'?'pending':'approved'}')">${p.approval_status==='approved'?'승인취소':'승인'}</button></td></tr>`).join(''):'<tr><td colspan="6" class="small">가입한 참가자가 없습니다.</td></tr>'}window.setApproval=async(id,status)=>{const {error}=await client.from('profiles').update({approval_status:status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadMembers()};$('logout').onclick=async()=>{await client.auth.signOut();location.href='./admin-login.html'};load();</script></body></html>
