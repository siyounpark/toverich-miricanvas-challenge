<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토브리치 미리캔버스 요소 챌린지</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><link rel="stylesheet" href="./theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:30px 20px 60px}.hero{color:#fff;border-radius:28px;padding:30px;display:flex;justify-content:space-between;gap:18px;align-items:center}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;opacity:.9}.userbox{background:rgba(255,255,255,.14);padding:12px 14px;border-radius:16px;font-size:14px}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:1.45fr .55fr;gap:18px;margin-top:20px}.card{background:#fff;border:1px solid #e9e9f1;border-radius:22px;padding:24px}.label{font-size:13px;font-weight:900}.title{font-size:30px;margin:10px 0 8px}.topic-card{margin-top:18px;border-radius:20px;padding:22px;color:#fff}.topic-card .today{display:inline-block;padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px}.topic-card .date{font-weight:800;margin:14px 0}.topic-label{font-size:12px;font-weight:900;opacity:.8;margin-top:8px}.topic-card .main{font-size:34px;font-weight:900;margin:4px 0 16px}.subs-label{font-size:12px;font-weight:900;opacity:.8;margin-bottom:7px}.topic-card .subs{display:flex;gap:7px;flex-wrap:wrap}.sub-chip{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.14);font-size:14px;font-weight:800}.field{margin-top:18px}.field label{display:block;font-weight:800;margin-bottom:7px}.input,.textarea{width:100%;border-radius:13px;padding:12px 13px;font:inherit}.textarea{min-height:90px;resize:vertical}.proof{margin-top:18px;padding:18px;border-radius:16px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.stat{font-size:34px;font-weight:900;margin:8px 0}.progress{height:13px;border-radius:999px;overflow:hidden}.bar{height:100%;width:0}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}.day{background:#fff;border:1px solid #e2e2eb;border-radius:16px;padding:14px;text-align:center;cursor:pointer}.day.locked{opacity:.5;cursor:not-allowed;background:#f5f4f7}.day.today-day{outline:2px solid #efdc4b}.day.unlocked{outline:2px dashed #7a568e}.day strong{display:block}.section-title{margin:30px 0 12px}.small{font-size:13px;color:#777}.status{margin-top:10px;font-weight:800}.day-alert{margin:16px 0 0;padding:13px 15px;border-radius:14px;background:#f7f0fa;color:#59326c;font-weight:800}.day-alert.warn{background:#fff5e8;color:#8a5b12}@media(max-width:760px){.grid{grid-template-columns:1fr}.days{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:28px}.title{font-size:25px}.topic-card .main{font-size:30px}}</style></head><body><main class="wrap"><section class="hero"><div><h1 id="challengeTitle">토브리치 미리캔버스 요소 제작 챌린지</h1><p id="notice">오늘의 주제를 확인하고 요소를 제작한 뒤 인증해주세요.</p></div><div class="userbox"><div><strong id="roundLabel"></strong> <span id="userName">참가자</span></div><button class="btn secondary" id="logout" style="margin-top:8px;padding:8px 11px">로그아웃</button></div></section><div id="dayAlert" class="day-alert"></div><div class="grid"><section class="card"><div class="label">TODAY'S CHALLENGE</div><h2 class="title" id="dayTitle">DAY 1</h2><div class="topic-card"><span class="today">🎯 오늘의 키워드</span><div id="displayDate" class="date"></div><div class="topic-label">대표주제</div><div id="mainTopic" class="main">대표요소주제</div><div class="subs-label">부주제 5개</div><div id="subTopics" class="subs"></div></div><div class="field"><label>오늘 제작한 요소 개수</label><input id="elementCount" class="input" type="number" min="0" placeholder="예: 10"></div><div class="proof"><strong>챌린지 인증 이미지</strong><p class="small">이미지 1장을 업로드하면 해당 DAY 챌린지가 1회 완료됩니다.</p><input id="proofFile" type="file" accept="image/*"><div id="proofStatus" class="status">아직 인증하지 않았습니다.</div></div><div class="field"><label>작업 메모</label><textarea id="note" class="textarea" placeholder="오늘 작업한 내용이나 느낀 점"></textarea></div><div class="actions"><button class="btn" id="saveSubmission">인증 저장</button></div></section><aside class="card"><div class="label">MY PROGRESS</div><div class="stat"><span id="doneCount">0</span>/<span id="durationCount">10</span></div><div class="small">완료한 챌린지</div><div class="progress"><div id="progressBar" class="bar"></div></div><div style="margin-top:22px"><div class="small">누적 제작 요소</div><div class="stat" style="font-size:28px"><span id="totalElements">0</span>개</div></div></aside></div><h3 class="section-title" id="scheduleTitle">챌린지 일정</h3><section id="days" class="days"></section></main><script>const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);const $=id=>document.getElementById(id);let user,profile,challenge,days=[],subs=[],unlocks=[],selected=1,currentDay=0;const kstToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());function dateDiff(a,b){return Math.floor((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000)}function accessDay(n){return profile?.role==='admin'||n===currentDay||unlocks.includes(n)}function setFormEnabled(ok){$('elementCount').disabled=!ok;$('proofFile').disabled=!ok;$('note').disabled=!ok;$('saveSubmission').disabled=!ok}function renderSubtopics(items){const values=(items||[]).slice(0,5);$('subTopics').innerHTML=values.length?values.map(x=>`<span class="sub-chip">${escapeHtml(x)}</span>`).join(''):'<span class="sub-chip">준비 중</span>'}function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function activeDayForDate(date){if(!challenge?.start_date)return 0;const end=challenge.end_date||date;let n=0;for(let d=new Date(challenge.start_date+'T00:00:00+09:00'),e=new Date(end+'T00:00:00+09:00');d<=e;d.setDate(d.getDate()+1)){const ds=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d),w=d.getDay();if(w!==0&&w!==6)n++;if(ds===date)return w===0||w===6?0:n}return 0}async function guard(){const {data:{session}}=await client.auth.getSession();if(!session){location.href='./login.html';return false}user=session.user;const {data:p}=await client.from('profiles').select('*').eq('id',user.id).single();if(!p){location.href='./login.html';return false}profile=p;$('userName').textContent=p.display_name||p.username||'참가자';return true}async function load(){if(!await guard())return;const {data:c}=await client.from('challenges').select('*').eq('is_active',true).order('round_number',{ascending:false}).limit(1).maybeSingle();if(!c){location.href='./login.html';return}challenge=c;if(profile.role!=='admin'){const {data:cp}=await client.from('challenge_participants').select('approval_status').eq('challenge_id',c.id).eq('participant_id',user.id).maybeSingle();if(!cp||cp.approval_status!=='approved'){location.href='./login.html';return}}$('roundLabel').textContent=`${c.round_number}기 ·`;$('challengeTitle').textContent=c.title;$('notice').textContent=c.participant_notice||'';$('durationCount').textContent=c.duration_days;$('scheduleTitle').textContent=`${c.round_number}기 · ${c.duration_days}일 챌린지 일정`;const {data:d}=await client.from('challenge_days').select('*').eq('challenge_id',c.id).order('day_number');days=d||[];const {data:s}=await client.from('submissions').select('*').eq('challenge_id',c.id).eq('participant_id',user.id);subs=s||[];const {data:u}=await client.from('challenge_day_unlocks').select('day_number').eq('challenge_id',c.id).eq('participant_id',user.id);unlocks=(u||[]).map(x=>x.day_number);currentDay=activeDayForDate(kstToday());renderAlert();renderDays();renderProgress();let initial=accessDay(currentDay)?currentDay:(unlocks[0]||1);selectDay(initial,true)}function renderAlert(){const el=$('dayAlert');if(!challenge.start_date){el.textContent='관리자가 시작일을 설정하면 당일 DAY만 열립니다.';el.className='day-alert warn';return}if(currentDay<1){el.textContent='오늘은 쉬어가는 날이거나 챌린지 시작 전입니다.';el.className='day-alert warn';return}el.textContent=`오늘은 DAY ${currentDay}입니다. 오늘 DAY만 인증할 수 있으며 지난 DAY와 미래 DAY는 잠겨 있습니다.`;el.className='day-alert'}function renderDays(){$('days').innerHTML='';for(let i=1;i<=challenge.duration_days;i++){const d=days.find(x=>x.day_number===i),done=subs.some(x=>x.challenge_day_id===d?.id),allowed=accessDay(i);let state=i===currentDay?'오늘':unlocks.includes(i)?'예외 열림':i<currentDay?'마감':'예정';const b=document.createElement('div');b.className='day'+(allowed?'':' locked')+(i===currentDay?' today-day':'')+(unlocks.includes(i)&&i!==currentDay?' unlocked':'');b.innerHTML=`<strong>DAY ${i}</strong><span class="small">${d?.topic||'준비 중'} · ${state}${done?' · 완료 ✓':''}</span>`;b.onclick=()=>{if(!allowed)return;selectDay(i)};$('days').appendChild(b)}}function selectDay(n,force=false){if(!force&&!accessDay(n))return;selected=n;renderDays();const d=days.find(x=>x.day_number===n);const allowed=accessDay(n);$('dayTitle').textContent=`DAY ${n} · ${d?.topic||'준비 중'}`;$('mainTopic').textContent=d?.topic||'대표요소주제';renderSubtopics(d?.keywords);const sub=subs.find(x=>x.challenge_day_id===d?.id);$('elementCount').value=sub?.element_count||'';$('note').value=sub?.note||'';$('proofStatus').textContent=sub?.proof_image_url?'인증 완료 ✓':allowed?'아직 인증하지 않았습니다.':'잠긴 DAY입니다.';setFormEnabled(allowed)}function renderProgress(){const done=subs.filter(x=>x.proof_image_url).length,total=subs.reduce((a,b)=>a+(b.element_count||0),0);$('doneCount').textContent=done;$('totalElements').textContent=total;$('progressBar').style.width=`${Math.min(100,done/challenge.duration_days*100)}%`}async function save(){const todayDay=activeDayForDate(kstToday());if(todayDay>0)currentDay=todayDay;if(!accessDay(selected))return alert('오늘 DAY 또는 관리자가 예외로 열어준 DAY만 인증할 수 있습니다.');const d=days.find(x=>x.day_number===selected);if(!d)return alert('이 DAY는 아직 준비되지 않았습니다.');const file=$('proofFile').files[0];let existing=subs.find(x=>x.challenge_day_id===d.id),url=existing?.proof_image_url||null;if(file){$('proofStatus').textContent='이미지 업로드 중...';const ext=file.name.split('.').pop();const path=`${user.id}/${challenge.id}/day-${selected}-${Date.now()}.${ext}`;const {error:e}=await client.storage.from('challenge-proofs').upload(path,file);if(e){$('proofStatus').textContent='업로드 실패';return alert('이미지 업로드 실패: '+e.message)}url=path}if(!url)return alert('챌린지 완료를 위해 인증 이미지 1장을 업로드해주세요.');$('proofStatus').textContent='인증 저장 중...';const payload={challenge_id:challenge.id,challenge_day_id:d.id,participant_id:user.id,element_count:Number($('elementCount').value||0),proof_image_url:url,note:$('note').value.trim(),updated_at:new Date().toISOString()};const res=existing?await client.from('submissions').update(payload).eq('id',existing.id):await client.from('submissions').insert(payload);if(res.error){$('proofStatus').textContent='저장 실패';return alert('저장 실패: '+res.error.message)}$('proofFile').value='';await load();$('proofStatus').textContent='인증 완료 ✓';alert('인증이 저장되었습니다.')}$('saveSubmission').onclick=save;$('logout').onclick=async()=>{await client.auth.signOut();location.href='./login.html'};load();</script><script src="./participant-schedule.js"></script></body></html>
