<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAY 예외 열기</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><link rel="stylesheet" href="./theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}.hero{color:#fff;border-radius:24px;padding:24px}.card{background:#fff;border:1px solid #e7e8ef;border-radius:20px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.small{font-size:13px;color:#777}.back{display:inline-block;margin-top:12px;text-decoration:none;font-weight:800}.empty{padding:18px 0;color:#777}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.row .btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><h1>지난 DAY 예외 열기</h1><p>놓친 DAY를 특정 참가자에게만 다시 열어줄 수 있습니다.</p><a class="back" href="./admin.html">← 관리자모드로 돌아가기</a></section><section class="card"><h2>예외 허용 추가</h2><div class="grid"><div><div class="small">참가자</div><select id="participant" class="input"></select></div><div><div class="small">DAY</div><select id="day" class="input"></select></div></div><button id="add" class="btn" style="margin-top:14px;width:100%">선택한 DAY 예외 열기</button><div id="msg" class="small" style="margin-top:10px"></div></section><section class="card"><h2>현재 예외 허용</h2><div id="list"></div></section></main><script>const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);const $=id=>document.getElementById(id);let challenge,profiles={};async function guard(){const {data:{session}}=await client.auth.getSession();if(!session){location.href='./admin-login.html';return false}const {data:p}=await client.from('profiles').select('role').eq('id',session.user.id).single();if(!p||p.role!=='admin'){location.href='./admin-login.html';return false}return true}async function load(){if(!await guard())return;const {data:c}=await client.from('challenges').select('*').eq('is_active',true).order('round_number',{ascending:false}).limit(1).maybeSingle();if(!c){$('msg').textContent='현재 운영 중인 챌린지가 없습니다.';return}challenge=c;const {data:cp}=await client.from('challenge_participants').select('participant_id,approval_status').eq('challenge_id',c.id).order('joined_at');const ids=(cp||[]).map(x=>x.participant_id);if(ids.length){const {data:ps}=await client.from('profiles').select('id,display_name,username').in('id',ids);(ps||[]).forEach(p=>profiles[p.id]=p)}$('participant').innerHTML=(cp||[]).map(x=>{const p=profiles[x.participant_id]||{};return `<option value="${x.participant_id}">${p.display_name||'-'} (${p.username||'-'}) · ${x.approval_status}</option>`}).join('');$('day').innerHTML=Array.from({length:c.duration_days},(_,i)=>`<option value="${i+1}">DAY ${i+1}</option>`).join('');await renderList()}async function renderList(){const {data:u}=await client.from('challenge_day_unlocks').select('*').eq('challenge_id',challenge.id).order('created_at',{ascending:false});$('list').innerHTML=(u||[]).length?(u||[]).map(x=>{const p=profiles[x.participant_id]||{};return `<div class="row"><div><strong>${p.display_name||'-'} (${p.username||'-'})</strong><div class="small">DAY ${x.day_number} 예외 허용</div></div><button class="btn" onclick="removeUnlock('${x.id}')">허용 취소</button></div>`}).join(''):'<div class="empty">현재 예외 허용된 DAY가 없습니다.</div>'} $('add').onclick=async()=>{if(!challenge)return;const participant_id=$('participant').value,day_number=Number($('day').value);if(!participant_id)return;$('msg').textContent='저장 중...';const {error}=await client.from('challenge_day_unlocks').upsert({challenge_id:challenge.id,participant_id,day_number,created_by:(await client.auth.getUser()).data.user.id},{onConflict:'challenge_id,participant_id,day_number'});$('msg').textContent=error?error.message:`DAY ${day_number}을 예외로 열었습니다.`;await renderList()};window.removeUnlock=async id=>{const {error}=await client.from('challenge_day_unlocks').delete().eq('id',id);if(error)return alert(error.message);await renderList()};load();</script></body></html>
