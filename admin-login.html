<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토브리치 챌린지 관리자 로그인</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;background:#f7f6fb;min-height:100vh;display:grid;place-items:center;color:#1d1d23}.card{width:min(460px,calc(100% - 32px));background:#fff;border:1px solid #ebe8f5;border-radius:24px;padding:34px;box-shadow:0 18px 50px rgba(70,55,150,.12)}.badge{display:inline-block;background:#efeafd;color:#5d4ce3;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900;margin-bottom:16px}h1{margin:0 0 8px;font-size:28px}.muted{color:#777;line-height:1.6;margin-bottom:24px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.input{width:100%;border:1px solid #dddbea;border-radius:13px;padding:14px;font:inherit}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#6554e8;color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.msg{display:none;margin-top:14px;padding:13px 14px;border-radius:12px;background:#f7f6fb;color:#555;line-height:1.5}.back{margin-top:18px;text-align:center}.back a{color:#6554e8;text-decoration:none;font-weight:800;font-size:13px}</style></head><body><main class="card"><div class="badge">ADMIN ONLY</div><h1>관리자 로그인</h1><p class="muted">참가자 로그인과 분리된 관리자 전용 화면입니다.</p><div class="field"><label>아이디</label><input id="username" class="input" value="damin" autocomplete="username"></div><div class="field"><label>비밀번호</label><input id="password" class="input" type="password" value="damin" autocomplete="current-password"></div><button id="submit" class="btn">관리자 로그인</button><div id="msg" class="msg"></div><div class="back"><a href="./login.html">참가자 로그인으로 돌아가기</a></div></main><script>const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);const $=id=>document.getElementById(id);const email=id=>`${id}@challenge.local`;let busy=false;function show(t){const el=$('msg');el.style.display=t?'block':'none';el.textContent=t}async function ensureAdmin(){const username=$('username').value.trim().toLowerCase(),password=$('password').value;if(username!=='damin'||password!=='damin'){show('관리자 아이디 또는 비밀번호가 올바르지 않습니다.');return}let sign=await client.auth.signInWithPassword({email:email(username),password});if(sign.error){const r=await fetch(`${APP_CONFIG.SUPABASE_URL}/functions/v1/register-username`,{method:'POST',headers:{'Content-Type':'application/json','apikey':APP_CONFIG.SUPABASE_KEY},body:JSON.stringify({username,password,display_name:'토브리치 관리자'})});const j=await r.json();if(!r.ok&&!String(j.error||'').includes('이미 사용')){show('관리자 계정을 준비하지 못했습니다.');return}sign=await client.auth.signInWithPassword({email:email(username),password})}if(sign.error){show('관리자 로그인에 실패했습니다.');return}const {data:p,error}=await client.from('profiles').select('role,approval_status').eq('id',sign.data.user.id).single();if(error||p.role!=='admin'){show('관리자 권한을 확인하지 못했습니다.');return}location.href='./admin.html'}$('submit').onclick=async()=>{if(busy)return;busy=true;$('submit').disabled=true;show('확인 중입니다...');try{await ensureAdmin()}catch(e){show('로그인 처리 중 오류가 발생했습니다.')}finally{busy=false;$('submit').disabled=false}};</script></body></html>
